services:
  speaking-coach:
    build:
      context: ./apps/speaking-coach-bot
      dockerfile: Dockerfile
    container_name: tg-speaking-coach
    restart: unless-stopped
    env_file:
      - ./apps/speaking-coach-bot/.env

  python-starter:
    build:
      context: ./apps/python-starter
      dockerfile: Dockerfile
    container_name: tg-bot-python
    restart: unless-stopped
    env_file:
      - ./apps/python-starter/.env
    volumes:
      - ./apps/python-starter/data:/app/data
    ports:
      - "8080:8080"

  ts-starter:
    build:
      context: ./apps/ts-starter
      dockerfile: Dockerfile
    container_name: tg-bot-ts
    restart: unless-stopped
    env_file:
      - ./apps/ts-starter/.env
    volumes:
      - ./apps/ts-starter/data:/app/data
    ports:
      - "3000:3000"
