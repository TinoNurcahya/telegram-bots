name: AI Shorts Studio Daily Production

on:
  schedule:
    # Runs daily at 01:00 UTC (08:00 WIB / Asia/Jakarta)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Video Topic (Leave empty for random 15+ mystery & science categories)'
        required: false
        default: ''
  repository_dispatch:
    types: [generate-video]

jobs:
  render_and_publish:
    name: Generate Video & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-video-generator-bot/requirements.txt'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-freefont-ttf fonts-dejavu-core libgl1 libglib2.0-0

      - name: Install Python Dependencies
        working-directory: apps/ai-video-generator-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Video Production Pipeline
        working-directory: apps/ai-video-generator-bot
        env:
          BOT_TOKEN: ${{ secrets.AI_SHORTS_BOT_TOKEN || secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TARGET_CHAT_ID: ${{ secrets.AI_SHORTS_TARGET_CHAT_ID || secrets.TARGET_CHAT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          AUTO_UPLOAD_YOUTUBE: 'true'
          ENABLE_DAILY_SCHEDULER: 'false'
        run: |
          # Determine topic from workflow_dispatch or repository_dispatch
          TOPIC="${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}"
          echo "Running with topic: $TOPIC"
          if [ -n "$TOPIC" ]; then
            python scripts/run_production_pipeline.py --trigger "${{ github.event_name }}" --topic "$TOPIC"
          else
            python scripts/run_production_pipeline.py --trigger "${{ github.event_name }}"
          fi
