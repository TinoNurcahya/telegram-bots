name: AI Shorts Studio Daily Production

on:
  schedule:
    # 5x Daily Shorts (9:16) + 1x Daily Long-Form Documentary (16:9) = 6 Videos/Day (9,900 / 10,000 YouTube API Quota Units)
    - cron: '0 6 * * *'    # Shorts Slot 1: 13:00 WIB
    - cron: '0 9 * * *'    # Shorts Slot 2: 16:00 WIB
    - cron: '0 12 * * *'   # Shorts Slot 3: 19:00 WIB
    - cron: '15 13 * * *'  # Long-Form Documentary (16:9, 4-6m): 20:15 WIB
    - cron: '30 14 * * *'  # Shorts Slot 4: 21:30 WIB
    - cron: '30 16 * * *'  # Shorts Slot 5: 23:30 WIB
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Video Topic (Leave empty for rotated mystery & science categories)'
        required: false
        default: ''
      format:
        description: 'Video format: shorts (9:16) or longform (16:9 Documentary)'
        required: false
        default: 'shorts'
  repository_dispatch:
    types: [generate-video]

concurrency:
  group: ai-shorts-studio-render
  cancel-in-progress: false

jobs:
  render_and_publish:
    name: Generate Video & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-video-generator-bot/requirements.txt'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-freefont-ttf fonts-dejavu-core libgl1 libglib2.0-0

      - name: Install Python Dependencies
        working-directory: apps/ai-video-generator-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Pending YouTube Upload Queue
        uses: actions/cache/restore@v4
        with:
          path: apps/ai-video-generator-bot/storage/pending_uploads
          key: pending-yt-uploads-${{ github.run_id }}
          restore-keys: |
            pending-yt-uploads-

      - name: Execute Video Production Pipeline
        working-directory: apps/ai-video-generator-bot
        env:
          BOT_TOKEN: ${{ secrets.VIDEO_GEN_BOT_TOKEN || secrets.AI_SHORTS_BOT_TOKEN || secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TARGET_CHAT_ID: ${{ secrets.VIDEO_GEN_TARGET_CHAT_ID || secrets.AI_SHORTS_TARGET_CHAT_ID || secrets.TARGET_CHAT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          AUTO_UPLOAD_YOUTUBE: 'true'
          ENABLE_DAILY_SCHEDULER: 'false'
          RETRY_FILE_ID: ${{ github.event.client_payload.retry_file_id || '' }}
          RETRY_CAPTION: ${{ github.event.client_payload.retry_caption || '' }}
          RETRY_MSG_ID: ${{ github.event.client_payload.retry_msg_id || '0' }}
        run: |
          # 1. If triggered by Telegram "Coba Upload ke YouTube Lagi" button, upload existing video directly without re-rendering
          if [ -n "$RETRY_FILE_ID" ]; then
            echo "Retrying YouTube upload for existing Telegram file_id..."
            python scripts/run_production_pipeline.py --retry-file-id "$RETRY_FILE_ID" --retry-caption "$RETRY_CAPTION" --retry-msg-id "$RETRY_MSG_ID"
            exit 0
          fi

          # 2. Otherwise determine topic and format from schedule, workflow_dispatch, or repository_dispatch
          TOPIC="${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}"
          FORMAT="${{ github.event.inputs.format || github.event.client_payload.format || 'shorts' }}"
          if [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
            FORMAT="longform"
          fi
          echo "Running pipeline | Format: $FORMAT | Topic: $TOPIC"
          if [ -n "$TOPIC" ]; then
            python scripts/run_production_pipeline.py --trigger "${{ github.event_name }}" --format "$FORMAT" --topic "$TOPIC"
          else
            python scripts/run_production_pipeline.py --trigger "${{ github.event_name }}" --format "$FORMAT"
          fi

      - name: Save Pending YouTube Upload Queue (If Any Deferred Videos Exist)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/ai-video-generator-bot/storage/pending_uploads
          key: pending-yt-uploads-${{ github.run_id }}
